name: Safety regression suite
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: PYTHONPATH=. python -m pytest -q tests
      - run: bash -n deploy/deploy.sh
      - run: python patches/apply-delivery-safety.py --check
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt

  whatsapp-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: wa_hub/package-lock.json
      - working-directory: wa_hub
        run: npm ci --no-audit --no-fund
      - working-directory: wa_hub
        run: npm test
      - working-directory: wa_hub
        run: npm audit --audit-level=high
