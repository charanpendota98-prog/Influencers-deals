<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Influencer Hub{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <span class="brand">🤝 Influencer Hub</span>
    <nav style="display:flex; align-items:center; gap:16px;">
      <a href="{{ url_for('index') }}">👥 Influencers</a>
      <a href="{{ url_for('secret_vault_tab') }}" style="color:#f472b6; font-weight:700; background:rgba(236,72,153,0.15); padding:4px 12px; border-radius:6px; border:1px solid rgba(236,72,153,0.4);">🔒 Secret Vault &amp; Sources</a>
      <a href="{{ url_for('vm') }}">💻 VM Health</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
